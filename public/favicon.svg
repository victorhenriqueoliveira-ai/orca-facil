<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Esquadro de marceneiro: duas linhas em ângulo reto, cor petróleo #2D5D5A -->
  <!-- Linha vertical do esquadro -->
  <line x1="8" y1="6" x2="8" y2="26" stroke="#2D5D5A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Linha horizontal do esquadro -->
  <line x1="8" y1="26" x2="26" y2="26" stroke="#2D5D5A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Check (✓) no canto interno do esquadro, cor terracota #C2703A -->
  <polyline points="12,18 15,22 22,13" stroke="#C2703A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
